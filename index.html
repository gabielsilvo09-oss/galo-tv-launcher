<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galo TV Launcher</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-focus: #333333;
            --galo-black: #000000;
            --galo-gold: #c5a059;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--galo-gold);
            padding-bottom: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-galo {
            background-color: var(--galo-black);
            color: var(--galo-gold);
            border: 2px solid var(--galo-gold);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 20px;
            border-radius: 8px;
        }

        .clock {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 20px;
            color: var(--galo-gold);
            margin: 25px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .row {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            min-width: 220px;
            flex: 0 0 auto;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .card:focus, .card.active {
            border-color: var(--galo-gold);
            background-color: var(--card-focus);
            transform: scale(1.05);
            outline: none;
        }

        .galo-card {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            border-left: 5px solid var(--galo-gold);
            min-width: 320px;
        }

        .galo-card h3 {
            margin: 0 0 10px 0;
            color: var(--galo-gold);
            font-size: 18px;
        }

        .galo-card p {
            margin: 5px 0;
            color: var(--text-main);
            font-size: 15px;
        }

        .yt-card {
            min-width: 260px;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .yt-thumbnail {
            width: 100%;
            height: 130px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: bold;
        }

        .yt-info {
            padding: 12px;
        }

        .yt-info h4 {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <div class="badge-galo">
