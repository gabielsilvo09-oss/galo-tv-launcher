<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galo TV Launcher</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-focus: #333333;
            --galo-black: #000000;
            --galo-gold: #c5a059;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
        }
        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--galo-gold);
            padding-bottom: 15px;
        }
        .header-title { display: flex; align-items: center; gap: 15px; }
        .badge-galo {
            background-color: var(--galo-black);
            color: var(--galo-gold);
            border: 2px solid var(--galo-gold);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 20px;
            border-radius: 8px;
        }
        .clock { font-size: 28px; font-weight: 300; color: var(--text-muted); }
        .section-title {
            font-size: 20px;
            color: var(--galo-gold);
            margin: 25px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            min-width: 220px;
            flex: 0 0 auto;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .card:focus, .card.active {
            border-color: var(--galo-gold);
            background-color: var(--card-focus);
            transform: scale(1.05);
            outline: none;
        }
        .galo-card {
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            border-left: 5px solid var(--galo-gold);
            min-width: 320px;
        }
